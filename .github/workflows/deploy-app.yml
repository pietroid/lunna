name: Deploy App

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/deploy-app.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build Flutter web and deploy to Pi
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create web production env file
        env:
          GOOGLE_SIGN_IN_CLIENT_ID: ${{ vars.GOOGLE_SIGN_IN_CLIENT_ID }}
          PROJECT_ID: ${{ vars.PROJECT_ID }}
          BACKEND_SERVICE_ACCOUNT: ${{ vars.BACKEND_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_SIGN_IN_CLIENT_ID:-}" ] || [ -z "${PROJECT_ID:-}" ] || [ -z "${BACKEND_SERVICE_ACCOUNT:-}" ]; then
            echo "Error: GOOGLE_SIGN_IN_CLIENT_ID, PROJECT_ID, and BACKEND_SERVICE_ACCOUNT must be set as repository variables."
            exit 1
          fi
          mkdir -p app/env
          cat > app/env/production.json <<EOF
          {
            "GOOGLE_SIGN_IN_CLIENT_ID": "${GOOGLE_SIGN_IN_CLIENT_ID}",
            "PROJECT_ID": "${PROJECT_ID}",
            "BACKEND_SERVICE_ACCOUNT": "${BACKEND_SERVICE_ACCOUNT}",
            "API_BASE_URL": "/api/",
            "FLAVOR": "production"
          }
          EOF

      - name: Build Flutter web app
        run: |
          cd app
          flutter pub get
          flutter build web \
            --release \
            --dart-define-from-file env/production.json

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PI_SSH_PRIVATE_KEY }}

      - name: Install cloudflared
        run: |
          set -euo pipefail
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Start Cloudflare SSH proxy
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.TUNNEL_SERVICE_TOKEN_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.TUNNEL_SERVICE_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          cloudflared access tcp --hostname deploy.pietroteruya.dev --url localhost:2222 > /tmp/cloudflared.log 2>&1 &
          sleep 5
          echo "--- cloudflared proxy logs ---"
          cat /tmp/cloudflared.log

      - name: Deploy to Raspberry Pi
        env:
          PI_HOST: ${{ vars.PI_HOST }}
          PI_USER: ${{ vars.PI_USER }}
        run: |
          set -euo pipefail

          echo "Ensuring web root exists on the Pi..."
          ssh -p 2222 -o StrictHostKeyChecking=accept-new "${PI_USER}@${PI_HOST}" \
            "mkdir -p /opt/focus/web"

          echo "Syncing web build to the Pi..."
          rsync -avz -e "ssh -p 2222" --delete app/build/web/ "${PI_USER}@${PI_HOST}:/opt/focus/web/"

          echo "Reloading nginx..."
          ssh -p 2222 -o StrictHostKeyChecking=accept-new "${PI_USER}@${PI_HOST}" \
            "docker exec focus-web nginx -s reload"

          echo "App deploy complete."
