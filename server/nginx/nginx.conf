server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Flutter web app: serve static files and fall back to index.html for
    # client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy: forward /api/* requests to the NestJS backend container.
    # The rewrite strips the /api/ prefix; the variable defers DNS lookup to
    # request time, preventing nginx from crashing when the backend container
    # isn't ready at startup.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend "focus-backend:3000";
        rewrite ^/api/?(.*)$ /$1 break;
        proxy_pass http://$backend$uri$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
