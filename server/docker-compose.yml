services:
  focus-backend:
    # The image name is controlled by an environment variable so the same file
    # works for both local builds (focus-backend:latest) and GitHub Actions
    # deploys (ghcr.io/OWNER/focus-backend:latest).
    image: ${FOCUS_BACKEND_IMAGE:-focus-backend:latest}
    container_name: focus-backend
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      # Wall-clock hours are the whole point of the day Focus draws, and a
      # container with no TZ runs in UTC: the working day would start at 07:00
      # UTC, which is four in the morning here, and anything booked in the
      # evening would land on tomorrow. Override it per deployment.
      TZ: ${FOCUS_TIMEZONE:-America/Sao_Paulo}
    env_file:
      - .env.production
    volumes:
      # Service account key is kept outside the repo and outside the container.
      # Place it on the Pi at this path before deploying.
      - /opt/focus/secrets/focus-backend-prod.json:/run/secrets/focus-backend-prod.json:ro
      # Thread data is persisted on the host so it survives container rebuilds.
      - /opt/focus/data/threads:/app/data/threads

  focus-agent:
    image: ${FOCUS_AGENT_IMAGE:-focus-agent:latest}
    container_name: focus-agent
    restart: unless-stopped
    expose:
      - "3002"
    environment:
      # The same zone as the backend, and for the same reason. The agent also
      # writes it onto the Google calendars it creates, so the day the user
      # opens in Google reads the same hours the app does.
      TZ: ${FOCUS_TIMEZONE:-America/Sao_Paulo}
      FOCUS_TIMEZONE: ${FOCUS_TIMEZONE:-America/Sao_Paulo}
    env_file:
      # The agent has its own environment file. It never sees the backend's
      # Firebase credentials or allowed-email list.
      - ../agent/.env.production
    volumes:
      # Google Calendar service account key, kept outside the repo and outside
      # the container just like the backend Firebase key. Place it on the Pi at
      # this path before deploying and set GOOGLE_APPLICATION_CREDENTIALS in
      # agent/.env.production.
      - /opt/focus/secrets/focus-calendar-prod.json:/run/secrets/focus-calendar-prod.json:ro
      # Which calendar belongs to which person, so a restart does not have to
      # look every one of them up by name again. Losing it costs one lookup.
      - /opt/focus/data/agent:/app/data

  focus-web:
    image: nginx:alpine
    container_name: focus-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - focus-backend
    volumes:
      # Flutter web build output. Populate this directory with the
      # app/scripts/deploy-web.sh script from your dev machine, or via the
      # GitHub Actions deploy-app workflow.
      - /opt/focus/web:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
