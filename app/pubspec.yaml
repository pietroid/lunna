name: lunna
description: Lunna app.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ^3.44.0

dependencies:
  agent:
    path: packages/agent
  api_client:
    path: packages/api_client
  app_ui:
    path: packages/app_ui
  artifacts:
    path: packages/artifacts
  auth:
    path: packages/auth
  bloc: ^9.2.1
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  go_router: ^15.1.2
  intl: ^0.20.2
  l10n:
    path: packages/l10n
  notifications:
    path: packages/notifications
  projects:
    path: packages/projects
  timeline:
    path: packages/timeline
  url_launcher: ^6.3.0
  # 0.10 pulls workmanager_apple 0.9.6+, which uses iOS 26 background task
  # types that Xcode 16 cannot compile. Lift once the build is on Xcode 26.
  workmanager: 0.9.2+1

dev_dependencies:
  bloc_lint: ^0.4.1
  bloc_test: ^10.0.0
  bloc_tools: ^0.1.0-dev.24
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true

# The launcher icons and the splash are per brand: see
# flutter_launcher_icons-<brand>.yaml and flutter_native_splash-<brand>.yaml,
# and brands/README.md for how to regenerate them.

dependency_overrides:
  # The last set of workmanager packages published together before 0.9.6.
  # Their own constraints are loose enough to resolve newer, mismatched
  # platform packages, so all three are held here.
  workmanager_android: 0.9.2
  workmanager_apple: 0.9.5
  workmanager_platform_interface: 0.9.3
