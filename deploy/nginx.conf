server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Flutter web app: serve static files and fall back to index.html for
    # client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The service worker and the entry page are never cached, so a deploy is
    # picked up on the next load.
    location ~ ^/(index\.html|flutter_service_worker\.js|flutter_bootstrap\.js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # API and Better Auth, passed through untouched: the backend serves
    # everything under /api itself, so the web app and its session cookie
    # share one origin. The variable defers DNS lookup to request time, so
    # nginx starts even if the backend container is not ready yet.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend "lunna-backend:3000";
        proxy_pass http://$backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
