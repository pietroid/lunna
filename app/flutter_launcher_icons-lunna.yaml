# Lunna's launcher icons: `dart run flutter_launcher_icons` (all brands).
# The mark on white, drawn from brands/lunna/*.svg (see brands/README.md).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "brands/lunna/icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "brands/lunna/foreground.png"
